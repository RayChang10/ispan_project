<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching 頁面調試</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
        button { padding: 10px 20px; margin: 5px; }
        input { padding: 8px; width: 300px; }
        .chat { height: 300px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; }
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user { background: #e3f2fd; }
        .assistant { background: #f3e5f5; }
    </style>
</head>
<body>
    <h1>Matching 頁面調試</h1>
    
    <div class="debug-section">
        <h3>1. 檢查 JavaScript 模組載入</h3>
        <button onclick="checkModules()">檢查模組載入</button>
        <div id="module-check" class="log"></div>
    </div>
    
    <div class="debug-section">
        <h3>2. 測試 API 調用</h3>
        <input type="text" id="search-query" placeholder="輸入搜尋關鍵字" value="Python 工程師">
        <button onclick="testApiCall()">測試 API 調用</button>
        <div id="api-test" class="log"></div>
    </div>
    
    <div class="debug-section">
        <h3>3. 模擬 Matching 頁面</h3>
        <div class="chat" id="chat"></div>
        <div style="margin-top: 10px;">
            <input type="text" id="msg" placeholder="輸入搜尋條件">
            <button onclick="sendMessage()">送出</button>
        </div>
        <div id="matching-test" class="log"></div>
    </div>

    <!-- 載入相同的 JavaScript 檔案 -->
    <script src="assets/js/common.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/matching.js"></script>

    <script>
        function log(elementId, message) {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            element.innerHTML += `[${timestamp}] ${message}<br>`;
            element.scrollTop = element.scrollHeight;
        }

        function checkModules() {
            const logElement = document.getElementById('module-check');
            logElement.innerHTML = '';
            
            log('module-check', '檢查 JavaScript 模組...');
            
            // 檢查 common.js
            if (typeof window.JobMate !== 'undefined') {
                log('module-check', '✅ common.js 已載入');
                log('module-check', `JobMate 物件: ${Object.keys(window.JobMate).join(', ')}`);
            } else {
                log('module-check', '❌ common.js 未載入');
            }
            
            // 檢查 api.js
            if (typeof window.JobMateAPI !== 'undefined') {
                log('module-check', '✅ api.js 已載入');
                log('module-check', `JobMateAPI 物件: ${Object.keys(window.JobMateAPI).join(', ')}`);
            } else {
                log('module-check', '❌ api.js 未載入');
            }
            
            // 檢查 matching.js 函數
            if (typeof recommendJobs !== 'undefined') {
                log('module-check', '✅ recommendJobs 函數可用');
            } else {
                log('module-check', '❌ recommendJobs 函數不可用');
            }
        }

        async function testApiCall() {
            const logElement = document.getElementById('api-test');
            const query = document.getElementById('search-query').value;
            logElement.innerHTML = '';
            
            log('api-test', `測試搜尋: "${query}"`);
            
            try {
                if (typeof window.JobMateAPI === 'undefined') {
                    log('api-test', '❌ JobMateAPI 未載入');
                    return;
                }
                
                log('api-test', '調用 JobMateAPI.JobSearch.searchJobs...');
                const result = await window.JobMateAPI.JobSearch.searchJobs(query, 3);
                
                log('api-test', `✅ API 調用成功`);
                log('api-test', `狀態: ${result.status}`);
                log('api-test', `職缺數: ${result.count}`);
                
                if (result.jobs && result.jobs.length > 0) {
                    result.jobs.forEach((job, i) => {
                        log('api-test', `${i+1}. ${job.job_title} - ${job.company_name}`);
                    });
                } else {
                    log('api-test', '沒有找到職缺');
                }
                
            } catch (error) {
                log('api-test', `❌ API 調用失敗: ${error.message}`);
                console.error('API 調用錯誤:', error);
            }
        }

        function sendMessage() {
            const msg = document.getElementById('msg').value.trim();
            if (!msg) return;
            
            // 模擬 matching.js 的 push 函數
            const chat = document.getElementById('chat');
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `<strong>你:</strong> ${msg}`;
            chat.appendChild(userMsg);
            
            // 清空輸入框
            document.getElementById('msg').value = '';
            
            // 調用 recommendJobs
            if (typeof recommendJobs !== 'undefined') {
                log('matching-test', `調用 recommendJobs("${msg}")`);
                recommendJobs(msg);
            } else {
                log('matching-test', '❌ recommendJobs 函數不可用');
            }
        }

        // 頁面載入完成後檢查
        document.addEventListener('DOMContentLoaded', function() {
            log('module-check', '頁面載入完成，開始檢查模組...');
            setTimeout(checkModules, 1000);
        });
    </script>
</body>
</html>
